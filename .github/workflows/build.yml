name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testes e build (debug)
        run: gradle --no-daemon testDebugUnitTest assembleDebug
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 0.1.${{ github.run_number }}

      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: saude-financeira-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
